stages:
  - build

variables:
  IMAGE_API: $CI_REGISTRY_IMAGE/api
  IMAGE_WEB: $CI_REGISTRY_IMAGE/web

.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-api:
  extends: .docker
  stage: build
  script:
    - docker build -t "$IMAGE_API:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_API:latest" ./backend
    - docker push "$IMAGE_API:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_API:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/**/*
        - .gitlab-ci.yml

build-web:
  extends: .docker
  stage: build
  script:
    - docker build -t "$IMAGE_WEB:$CI_COMMIT_SHORT_SHA" -t "$IMAGE_WEB:latest" ./frontend
    - docker push "$IMAGE_WEB:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_WEB:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
