[project]
name = "geopulse-ml"
version = "0.1.0"
description = "Human-in-the-loop object detection for street imagery — companion to GeoPulse."
readme = "README.md"
authors = [
    { name = "Nebojša Gašparović", email = "nebojsa.gasparovic@fvd.net" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=10.4",
    "rich>=13.9",
    "typer>=0.12",
]

[project.optional-dependencies]
training = [
    "modal>=1.0",
    "ultralytics>=8.3",
]

[project.scripts]
geopulse-ml = "geopulse_ml.cli:app"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
